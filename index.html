      // Registers the embedded Hebrew-capable font on a freshly-created
      // jsPDF document -- fonts are per-document in jsPDF, so this needs
      // to run once per `new jsPDF(...)` call, before any text is drawn.
      registerHebrewFont: function(doc) {
        Object.keys(app.FREESANS_HEBREW_FONTS).forEach(function(style) {
          var filename = 'FreeSansHebrew-' + style + '.ttf';
          doc.addFileToVFS(filename, app.FREESANS_HEBREW_FONTS[style]);
          doc.addFont(filename, 'FreeSansHebrew', style);
        });
      },

      // Round 1 of the RTL fix hand-rolled a bidi approximation here (split
      // into Hebrew/Latin runs, reverse each Hebrew run's characters,
      // reverse the run order) and fed the ALREADY-reordered string to
      // doc.text() as a plain string. Real-world test: letters now render
      // correctly (the font fix worked) but the order still came out
      // left-to-right, i.e. as if nothing had been reordered at all --
      // consistent with jsPDF ALSO doing its own RTL handling internally
      // for text drawn with a custom/embedded Unicode font, which would
      // cancel out a second manual reversal stacked on top of it (reverse
      // it myself, jsPDF reverses it back). Switched to jsPDF's own
      // documented mechanism for this instead of guessing at another
      // hand-rolled one: doc.text()'s options object accepts isInputRtl,
      // which tells jsPDF the given string is logical-order RTL text and
      // to handle the reordering (including mixed Hebrew/Latin runs
      // within it) itself, rather than assuming the string is already in
      // visual order the way a plain doc.text() call does.
      // Detection stays simple -- if a wrapped line contains any Hebrew
      // character, pass isInputRtl; a pure-Latin/number line (the common
      // case: name, address, product) is left completely alone.
      // Caveat: this sandbox has no network access to the real jsPDF
      // library, so none of this can be rendered and visually checked here
      // the way the print/Word paths were all session -- this is my best
      // read of jsPDF's documented behavior, not something verified
      // against a real PDF. Please test print another Hebrew note and
      // report back exactly what's still off.
      HEBREW_RE: /[\u0590-\u05FF\uFB1D-\uFB4F]/,

      // Builds a jsPDF document with one page per label, page size set
      // directly to cfg.labelDim x cfg.heightDim -- no browser print
      // pipeline involved, so nothing can silently substitute Letter/A4 the
      // way Android's print-to-PDF does. Layout deliberately mirrors
      // buildLabelsHtml's content and ordering (same fields, same bold/
      // border treatment) but is NOT pixel-identical to it -- jsPDF lays
      // out text by manually tracking a y-cursor rather than a real CSS
      // engine, so it hasn't had the same real-hardware verification the
      // print/Word paths have. Worth a test print before relying on it for
      // a busy Friday.
      buildLabelsPdf: function(orders) {
        var cfg = app.getLabelStyleConfig(app.labelSize);
        var pageWmm = app.mmFromDim(cfg.labelDim);
        var pageHmm = app.mmFromDim(cfg.heightDim);
        var padMm = app.mmFromPx(cfg.padding);
        var qrMm = app.mmFromPx(cfg.qrSize);
        var rightGapMm = app.mmFromPx('9px');
        // Mirrors buildLabelsHtml's rightPadding reservation so text never
        // runs under the QR/count column in the top-right corner.
        var textWidthMm = pageWmm - (2 * padMm) - qrMm - app.mmFromPx('10px');
        // Real-world PDF prints came out shifted left (see pdfLeftShiftMm
        // comment on the 2.25x1.25 preset) -- leftMm is where all
        // left-anchored content actually starts, padMm left as-is for the
        // right-side reservation math above so only the left edge moves.
        // Shrinks the text column by the same amount rather than changing
        // where the QR/count sit, since only the left side was reported off.
        var leftMm = padMm + (cfg.pdfLeftShiftMm || 0);
        textWidthMm -= (cfg.pdfLeftShiftMm || 0);

        // jsPDF defaults to portrait and will silently SWAP a [width,height]
        // format's two values to force height >= width unless orientation
        // is told explicitly which way the page actually goes -- both label
        // presets are wider than tall, so without this every PDF came out
        // rotated 90 degrees (confirmed against a real download: a 55x29mm
        // label came out as a 29x55mm page, with the header text run off
        // the now much-narrower edge since the text-wrap math was still
        // sized for the real 55mm width).
        var orientation = pageWmm > pageHmm ? 'l' : 'p';
        var doc = new window.jspdf.jsPDF({ unit: 'mm', format: [pageWmm, pageHmm], orientation: orientation });
        app.registerHebrewFont(doc);
        var firstPage = true;

        function addWrapped(text, sizePx, style, lineGapFactor) {
          doc.setFont('FreeSansHebrew', style || 'normal');
          doc.setFontSize(app.ptFromPx(sizePx));
          // Wrap on the ORIGINAL logical text first -- splitTextToSize needs
          // real reading order to find correct word boundaries -- then pass
          // each already-wrapped line to jsPDF's own isInputRtl handling
          // (see the HEBREW_RE comment above) if it contains Hebrew.
          // Wrapping AFTER reordering (if this were done manually) would
          // wrap at the wrong points, since reordered text's word/space
          // positions no longer match the logical text's -- wrapping stays
          // on logical text either way, only the drawing step changes.
          var lines = doc.splitTextToSize(String(text), textWidthMm);
          lines.forEach(function(line) {
            y += app.mmFromPx(sizePx) * (lineGapFactor || 1.15);
            if (app.HEBREW_RE.test(line)) {
              doc.text(line, leftMm, y, { isInputRtl: true });
            } else {
              doc.text(line, leftMm, y);
            }
          });
        }

        var y; // current vertical cursor, reset per label below

        orders.forEach(function(order) {
          if (!order.items) return;
          var deliveryNameDisplay = (order.deliveredTo && order.deliveredTo.trim()) ? order.deliveredTo.trim() : app.cleanLastName(order.lastName);
          var addressParts = app.splitAddress(order.address);
          var addressLines = addressParts.city ? [addressParts.address, addressParts.city] : [addressParts.address];

          order.items.forEach(function(item, idx) {
            if (!firstPage) doc.addPage([pageWmm, pageHmm], orientation);
            firstPage = false;
            y = padMm;

            // Header: bordered box, centered, bold -- matches .header.
            var headerH = app.mmFromPx(cfg.headerSize) * 1.6;
            doc.setLineWidth(0.12);
            doc.rect(leftMm, y, textWidthMm, headerH);
            doc.setFont('FreeSansHebrew', 'bold');
            doc.setFontSize(app.ptFromPx(cfg.headerSize));
            doc.text('BASKETS BY BLIMI', leftMm + textWidthMm / 2, y + headerH / 2 + app.mmFromPx(cfg.headerSize) * 0.3, { align: 'center' });
            y += headerH + app.mmFromPx('2px');

            addWrapped(deliveryNameDisplay, cfg.fontSize, 'bold');
            var productDisplay = item.quantityIndividual ? (item.quantityIndividual + ' ' + item.product) : item.product;
            addWrapped(productDisplay, cfg.productSize, 'bold');
            if (item.specialInstructions) addWrapped(item.specialInstructions, cfg.addressSize, 'bolditalic');

            // Address: bold, ruled top and bottom -- matches .address.
            y += app.mmFromPx('2px');
            doc.setLineWidth(0.1);
            doc.line(leftMm, y, leftMm + textWidthMm, y);
            y += app.mmFromPx('2px');
            addressLines.forEach(function(line) { addWrapped(line, cfg.addressSize, 'bold', 1.1); });
            y += app.mmFromPx('2px');
            doc.line(leftMm, y, leftMm + textWidthMm, y);

            if (order.customerNote) {
              y += app.mmFromPx('2px');
              // Same per-note length-based sizing as the print/Word path
              // (see app.pickNoteFontPx) instead of one flat size for the
              // whole batch, so a long note doesn't overflow just because an
              // earlier note in the same download was short.
              addWrapped('Note: ' + order.customerNote, app.pickNoteFontPx(cfg, order.customerNote), 'bold');
            }

            // QR + count, top-right -- same corner reservation as print.
            var qrX = pageWmm - qrMm - rightGapMm;
            doc.addImage(app.QR_CODE_DATA_URI, 'PNG', qrX, app.mmFromPx('2px'), qrMm, qrMm);
            doc.setFont('FreeSansHebrew', 'bold');
            doc.setFontSize(app.ptFromPx(cfg.countSize));
            doc.text((idx + 1) + ' of ' + order.items.length, pageWmm - rightGapMm, app.mmFromPx('2px') + qrMm + app.mmFromPx(cfg.countSize) * 0.9, { align: 'right' });
          });
        });

        return doc;
      },

      downloadLabelsPdf: function() {
        var dayOrders = app.getOrdersForDate(app.selectedDate);
        if (dayOrders.length === 0) { alert('No orders to download'); return; }
        if (!window.jspdf) { alert('PDF library failed to load -- check your internet connection and try again.'); return; }
        app.buildLabelsPdf(dayOrders).save('BasketsByBlimi_' + app.selectedDate + '_Labels.pdf');
      },

      downloadOrderPdf: function(orderIdx) {
        var dayOrders = app.getOrdersForDate(app.selectedDate);
        if (orderIdx < 0 || orderIdx >= dayOrders.length) { alert('Order not found'); return; }
        var order = dayOrders[orderIdx];
        if (!order.items) { alert('No items in this order'); return; }
        if (!window.jspdf) { alert('PDF library failed to load -- check your internet connection and try again.'); return; }
        var cleanName = app.cleanLastName(order.lastName);
        app.buildLabelsPdf([order]).save('BasketsByBlimi_' + app.selectedDate + '_' + cleanName + '.pdf');
      },

      // Switches which label size print/download use, and remembers the
      // choice on this device so it's still selected next visit.
      setLabelSize: function(size) {
        app.labelSize = size;
        localStorage.setItem('labelSize', size);
        app.render();
      },

      // Font/spacing per label size. '4x3' and '3x2' used to share the
      // exact same (small) type sizes -- copy-pasted from one to the other
      // at some point and never tuned up for the bigger label -- which is
      // why a 4x3 label came out of the printer mostly blank: the same
      // handful of short lines that fill a 3x2 label just don't reach far
      // down a label a third taller. Sized independently now so each one
      // actually fills its label. Also fixes .count silently ignoring the
      // countSize it computed and always printing at a hardcoded 14px.
      //
      // RESOLVED (Sep): the 4x3 physical print problem turned out to be
      // neither a CSS sizing nor a rotation problem at all -- the Windows
      // driver's Paper Name was set to a completely different, unrelated
      // size (100mm x 150mm, ~4x6in) than the actual loaded stock (4x3in),
      // so it was scaling/positioning our correctly-sized page onto the
      // wrong canvas the whole time. Fixed by adding a matching custom
      // paper size (101.6mm x 76.2mm) in the printer's own "Page settings"
      // dialog and selecting it there -- nothing in this file needed to
      // change once that was found. Worth checking FIRST on any future
      // "wrong size on THIS printer" report, before touching this code:
      // Windows Settings/Control Panel -> Devices and Printers -> right-
      // click the printer -> Printing preferences -> Page settings -> Paper
      // Name actually matches the label stock physically loaded.
      // Picks the customerNote font size for ONE specific note's text length,
      // instead of one fixed size applied to every label in a batch. A
      // preset can opt into this via noteSizeThresholds (ordered smallest
      // maxLen first, last entry should use Infinity as a catch-all); a
      // preset without thresholds keeps the old behavior (flat cfg.noteSize,
      // or the *0.8-of-fontSize fallback for a preset that sets neither) --
      // same result as before for every preset except 4x3, which is the
      // only one long/multi-sentence notes were reported on so far.
      pickNoteFontPx: function(cfg, noteText) {
        if (cfg.noteSizeThresholds) {
          var len = (noteText || '').length;
          for (var i = 0; i < cfg.noteSizeThresholds.length; i++) {
            if (len <= cfg.noteSizeThresholds[i].maxLen) return cfg.noteSizeThresholds[i].size + 'px';
          }
          return cfg.noteSizeThresholds[cfg.noteSizeThresholds.length - 1].size + 'px';
        }
        return cfg.noteSize || (Math.ceil(parseInt(cfg.fontSize) * 0.8) + 'px');
      },

      getLabelStyleConfig: function(size) {
        // qrSize was originally set far too small to reliably scan (e.g.
        // 34px / ~0.35in on the 4x3 label -- each QR module worked out to
        // roughly a single printed pixel). Bumped up across every preset so
        // the printed code is physically big enough for a phone or webcam
        // to focus on and read.
        if (size === '4x3') {
          // headerSize (business name) and addressSize bumped up on request
          // -- the business name should stand out for marketing and the
          // address should be easy for a delivery person to read at a
          // glance. Plenty of blank space below the content at the old
          // sizes (see earlier verification renders), so there's room.
          // noteSize (Sep): customerNote used to render at fontSize*1.5
          // (33px here) regardless of how long the note was -- fine for a
          // short one-line note, but real customer notes are "good wishes"
          // that can run a few full sentences, and at 33px even one
          // sentence overflowed WAY past the label's height (confirmed on a
          // real Word download: -67% headroom, the note visibly bled past
          // the label's border into where the next label/page starts).
          // 13px verified via headroom measurement against a real ~300-
          // character multi-sentence note ("Mazel Tov! Wishing you both...
          // Iris Road.") at 20.4% headroom -- comfortably fits, with margin
          // to spare for something a bit longer still.
          // printLeftShiftPx / wordLeftShiftPx (Sep, round 5): still off by
          // ~2mm on BOTH the print path and the Word download after round 4
          // -- reported together this time (not split like round 3's "Word
          // just a tad, app more than a tad"), so both get the same-sized
          // bump: printLeftShiftPx 32->40px and wordLeftShiftPx 24->32px
          // (+8px/~2mm each). Right edge untouched again -- only the left
          // edge was flagged this round.
          // (Round 4: Word needed only "a tad more" (20->24px) while print
          // "needs more than a tad" (24->32px) -- different-sized bumps that
          // round since the two paths were off by different amounts then.
          // Round 3: both cut off "a millimeter or two" AND "right up
          // against the edge" on the right -- fixed via left shifts
          // print 16->24px/word 8->20px, padding bumped 16->18px, the
          // print path's QR/count column moved further from the edge
          // (qrRightOffset 9px default -> explicit 16px, same mechanism
          // already proven on the small label), and fontSize/headerSize/
          // productSize/addressSize/countSize all trimmed down slightly per
          // "squeeze the font a little" -- smaller text needs less
          // horizontal room, which is what bought back margin on the right
          // without shrinking the usable page any further.)
          // Re-verified via headroom probe against the same worst-case
          // long-product/long-address/long-note combination as before --
          // still holds double-digit headroom across every note-length step
          // (see noteSizeThresholds below) even at the larger 40px shift.
          // noteSizeThresholds (Sep): a single fixed noteSize (was 13px)
          // can't work for arbitrary-length notes -- "a few sentences" of
          // good wishes can run anywhere from one short line to several
          // hundred characters, and any one fixed size either overflows on
          // long notes or looks tiny/wastes space on short ones. Replaced
          // with length-based steps (see app.pickNoteFontPx below, now
          // computed per-note instead of once for the whole batch, since a
          // batch download can mix short and long notes across orders).
          // Re-probed against a realistic WORST case (a long product name
          // like "Cubed Fruit - 9x13 pan - 2 pans- melons - Diced" plus a
          // full one-line address, not just a short product/address) after
          // the first-pass thresholds turned out optimistic against that --
          // e.g. the first-pass 16px step only held 14.2% headroom here
          // instead of the ~21% measured against shorter placeholder
          // content. Every step below targets >=15% on this worst case,
          // except the 450-char step (10px, 12.8%) which is the one
          // instance where the next size up (11px) dropped to 5.5% -- still
          // safely positive, just a thinner margin than the rest:
          // <=80: 16px (30.8%), <=150: 15px (21.5%), <=250: 13px (15.9%),
          // <=350: 11px (16.9%), <=450: 10px (12.8%), <=550: 9px (13.1%),
          // <=700: 8px (14.2%), <=1000: 7px (13.5%), beyond that: 6px
          // (20.4% even at 1000 chars, still 16.3% at 1200) -- small and
          // hard to read at that point, but a genuinely enormous note
          // degrading to small text beats it overflowing past the label.
          //
          // Bumped again (Sep, "note should be sized bigger... go down
          // another half inch"): the label was stopping ~1in short of the
          // bottom on typical short/medium notes, which is exactly what
          // the old thresholds' 20-30% headroom on those buckets predicts.
          // Re-swept every step against the SAME worst-case content above,
          // one integer px at a time, and found the headroom does not
          // shrink smoothly -- each extra px eventually forces one more
          // wrapped line, which costs far more height than 1px and can
          // flip a step from comfortably positive straight to overflow.
          // The <=250 through <=1000 steps were already sitting right at
          // that wrap cliff (the next size up on every one of them went
          // negative), so raising them further risks text running past the
          // label edge and they're left exactly as tuned above. The <=80
          // and <=150 steps had real slack (short notes were the visible
          // gap): <=80 goes 16px->20px (30.8%->9.5% headroom, still safely
          // positive against the worst case, ~27.6% typical), <=150 goes
          // 15px->16px (21.5%->10.9%, ~28.6% typical). Together these cover
          // the common case (short thank-you notes like the ones in real
          // orders) with meaningfully bigger text and reclaim close to the
          // requested half inch there; longer notes keep their prior sizes
          // since they're already at the safe limit.
          return { labelDim: '4in', heightDim: '3in', padding: '18px', fontSize: '20px', headerSize: '16px', productSize: '18px', addressSize: '15px', countSize: '16px', qrSize: '80px', qrRightOffset: '16px', noteSizeThresholds: [{ maxLen: 80, size: 20 }, { maxLen: 150, size: 16 }, { maxLen: 250, size: 13 }, { maxLen: 350, size: 11 }, { maxLen: 450, size: 10 }, { maxLen: 550, size: 9 }, { maxLen: 700, size: 8 }, { maxLen: 1000, size: 7 }, { maxLen: Infinity, size: 6 }], printLeftShiftPx: 40, wordLeftShiftPx: 32 };
        } else if (size === '3x2') {
          return { labelDim: '3in', heightDim: '2in', padding: '10px', fontSize: '14px', headerSize: '9px', productSize: '13px', addressSize: '11px', countSize: '14px', qrSize: '60px', noteSize: '10px' };
        } else if (size === '2x1') {
          return { labelDim: '2in', heightDim: '1in', padding: '4px', fontSize: '8px', headerSize: '6px', productSize: '8px', addressSize: '7px', countSize: '10px', qrSize: '40px', noteSize: '6px' };
        } else if (size === '2.25x1.25') {
          // The small thermal label option, alongside 4x3. The driver's
          // Paper Manage dialog says this paper is 57mm x 31mm, but real
          // test prints showed the printer's actual usable print window is
          // a bit smaller AND slightly offset from that -- printing at
          // exactly 57x31mm cut off the top and (more severely) the right
          // side, and nudging the driver's own Position Adjustment offset
          // just traded a top cutoff for a bottom cutoff instead of fixing
          // both, meaning the true printable window genuinely doesn't have
          // room for the full 57x31mm no matter how it's aligned.
          // Deliberately declaring the page a few mm SMALLER than the
          // driver's stated size on both axes (55x29 instead of 57x31) so
          // there's real slack on every edge and the printer's positioning
          // imprecision (a mm or two) stops mattering, rather than chasing
          // an exact offset value test print by test print. The label
          // prints slightly inset from the physical edges as a result --
          // a small tradeoff for not losing real content/border on any side.
          // Width specifically was probed down to 52mm before settling here
          // -- below ~55mm the address line wraps onto an extra line and
          // eats nearly all the vertical headroom (4.8% instead of 15.9%),
          // so going narrower than this would trade a right-edge fix for a
          // new bottom-overflow risk.
          // Address was asked to stand out more for the delivery person
          // (and the business name for marketing) -- but simply bumping
          // addressSize past 11px pushed "Lakewood, NJ 08701" onto its own
          // extra (3rd) line in this narrow a column, which ate nearly all
          // the vertical headroom on its own. Made the address bold instead
          // of bigger to make it stand out -- bold at the same 11px size
          // still trips the same 3-line wrap (bold glyphs are wider), so
          // name/product were shrunk to make room for it rather than fight
          // the wrap. Net effect: address is now the visually dominant
          // block on the label (bold, larger relative weight) even though
          // its font-size didn't change. Re-verified at ~16% headroom,
          // matching the margin this preset has held at since the 55x29mm
          // shrink -- see probe_address measurements: addressSize past 11px
          // here costs far more height than it looks like it should.
          // headerSize got over-corrected down to 8px (smaller than its
          // original 9px!) while chasing headroom for the above -- fixed
          // back up to 11px (visibly bigger than original, as intended)
          // after confirming there was still 13%+ headroom to spare.
          // Later requests: the header now gets a border + text-align:center
          // (see .header rule below) since most small labels won't carry a
          // customerNote, so that reserved-for-notes space wasn't needed.
          // addressSize pushed to 12px ("nine point", i.e. ~9pt in the
          // point sizing most people think in, not 9px) since there was
          // room -- but the header border+padding alone dropped headroom to
          // 6.4%, so name/product were shrunk further (11->10, 9->8) to buy
          // it back; 8px product happens to also fit on one line instead of
          // two, which helped more than expected. Re-verified at ~19%
          // headroom with all of the above combined.
          //
          // printRightTrim (Sep): on the actual Y813BT printing this app's
          // own Print button (not the PDF/FlashLabel path -- that one was
          // separately reported shifted the OPPOSITE way, too far left, and
          // is left alone here), everything -- flush-left text AND the
          // right-anchored QR/count -- came out shifted too far right on
          // the physical label, with the QR/count column running closest
          // to the true edge. Shrinks the *visible content box* by this
          // amount, leaving it as unused blank space on the label's right
          // edge, WITHOUT touching cfg.labelDim (the declared page/paper
          // size the driver is set to) or the padding/qrSize numbers that
          // the address-wrap headroom above was tuned against -- so this
          // should be safe from the 3-line wrap regression that guards the
          // width probe above. Only applied to the print path (see
          // labelWidthCss in buildLabelsHtml); Word isn't affected since it
          // wasn't reported having this problem. First-pass guess (not
          // verified against a real print) -- nudge up or down and re-test
          // if it's still off, the same way the qr/count 9px offset below
          // was tuned in a few real rounds.
          // printRightTrim raised 4px -> 18px (you measured the app's print
          // as ~5mm/19px too far right). Stopped one px short of the full
          // 19px on purpose: probed every value up to 20px against the
          // longest realistic address ("1234 Winterberry Court Apartment
          // 12B, Lakewood, NJ 08701") and 18px is the last one that still
          // holds positive headroom (7.2%) -- 20px flips it to -4.9%,
          // meaning that address's text would actually run past the bottom
          // of the label. 18px gets you ~4.76mm of the ~5mm correction,
          // about a quarter-mm short -- should be within normal print
          // tolerance, but if it's still visibly off, the rest likely needs
          // to come from the driver's own Horizontal Position Adjustment
          // rather than shrinking this box any further, since we're now at
          // the real ceiling for this preset's width.
          // pdfLeftShiftMm: the PDF path (opened in FlashLabel Pro, or
          // printed from Windows via a PDF viewer's own print dialog) was
          // separately reported drifting the OPPOSITE way from the app's
          // Print button -- about 5mm too far LEFT instead of too far
          // right -- so it needs its own, independent correction rather
          // than sharing printRightTrim above. See buildLabelsPdf's use of
          // this value: shifts the left-anchored content (header/name/
          // product/address) 5mm right, leaving that as blank space on the
          // physical label's left edge instead. The right-anchored QR/count
          // aren't touched since only the PDF's left side was reported off.
          // noteSize (Sep): same overflow bug as the 4x3 preset, worse here
          // since there's so little room to begin with -- even a SHORT
          // one-sentence note ("Mazel Tov! Best wishes from the Friedman
          // family.") only just fits at 7px (8.4% headroom); the old
          // fontSize*1.5 formula (15px) was wildly overflowing even on a
          // short note (-26.3%). This preset genuinely has little room for
          // notes at all -- matches the earlier "most small labels won't be
          // getting notes" call -- so 7px is about the ceiling, not a
          // comfortable size; a longer note will likely still overflow.
          return { labelDim: '55mm', heightDim: '29mm', padding: '4px', fontSize: '10px', headerSize: '11px', productSize: '8px', addressSize: '12px', countSize: '11px', qrSize: '50px', printRightTrim: '18px', qrRightOffset: '20px', pdfLeftShiftMm: 5, noteSize: '7px' };
        }
        // Unknown/unset labelSize -- fall back to the smallest, safest
        // preset rather than silently rendering with undefined CSS values.
        return app.getLabelStyleConfig('2x1');
      },

      // Tiny (386-byte) QR code for basketsbyblimi.com, generated once
      // ahead of time and embedded directly rather than loaded from a live
      // QR-generator URL at print time. These labels need to render
      // correctly wherever/whenever they're printed -- including offline,
      // or from a Word doc opened later on a machine with no internet --
      // so nothing about how the label looks should depend on a network
      // request succeeding at that moment. Verified (decoded back with
      // zbar) to actually scan to https://basketsbyblimi.com before this
      // was embedded.
      QR_CODE_DATA_URI: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQgAAAEIAQAAAACLjVdSAAABSUlEQVR4nO2YO27FMAwEZ4N3/ytPCn1sJ4WryAxkV4I8xWJBUiQjN9/XHfASL/ESmxIfgLSzRCLEeVNH6UI/ECBg7GaMmzpKV/pBQIgEmxnpnpRR+gQRMTNbntNRivCWWKPjEaLnS/fAiEFOrlRRutKPU4LEVlUX66hC5Jwd+ZUsy3RUISKz32heBHp47Pi+XOJjPLizLVunoxQRkpBmhQRismU/NuMjM0tGV9Z/VlG6sn4whpd5b8yO80sjBDARQZsdsmv96BOLRDTRELasH53oI22fXBLBLd/bz3FMLxrtDHHDfLn2p6avQBhPTB2lC+NjbMPMyJI21234vlz2Y0d0eEROFaVL60cunrTymh3r6Q/iaEAI2fe97Z+tkqJjjVpV6V8Rl/2YY4zxtAqponSlH7PrcEy5x2UVpU/sP57T8RIv8RL/j/gGZkeBDjI2DJYAAAAASUVORK5CYII=',

      // Builds the full print-ready HTML page (styles + one .label div per
      // item) for a list of orders, sized per app.labelSize. Shared by
      // printLabels (whole day) and printOrder (one order) so the two never
      // drift out of sync with each other the way the old copy-pasted
      // versions of this did.
      buildLabelsHtml: function(orders, forWord) {
        var cfg = app.getLabelStyleConfig(app.labelSize);
        // Was fontSize*1.5 -- fine for a short one-liner, but real customer
        // notes are "good wishes" that can run a few full sentences, and at
        // 1.5x even one sentence badly overflowed the label (see noteSize
        // comment on the 4x3 preset above for the real numbers). Font size
        // is no longer decided once for the whole batch here -- a batch can
        // mix short and long notes across different orders, so .note no
        // longer carries a shared font-size in the stylesheet below; each
        // note div gets its own inline size from app.pickNoteFontPx (see
        // where textBlockHtml is built) sized to that specific note's length.
        // The QR code (and the count badge stacked under it) live in an
        // absolutely-positioned column in the top-right corner, which does
        // NOT push the normal-flow text (header/name/product/address) out
        // of its way -- so without extra room reserved, a long product
        // name or address could render right underneath/behind the QR
        // image. Reserving that space as extra padding on the *right* side
        // of the whole label (on top of the normal padding) keeps every
        // line of flowing text clear of that corner for the label's full
        // height, not just near the top, at the cost of a slightly
        // narrower text column throughout -- simpler and safer than trying
        // to wrap text around the image only near the top, especially
        // given Word's limited CSS support.
        var paddingNum = parseInt(cfg.padding);
        var qrSizeNum = parseInt(cfg.qrSize);
        // The qr/count column's distance from the label's right edge.
        // Started at 9px (bumped up from 2px -> 5px across earlier real
        // test prints, back when the count text alone kept reading as cut
        // off). On the physical Y813BT, even 9px wasn't enough once the
        // whole QR code was checked (not just the count text next to it) --
        // a real photo showed the QR itself noticeably clipped on the right
        // while the flowing text (which already had a much bigger built-in
        // margin -- see rightPadding below) was fully clear. Bumped to 20px
        // for real headroom; verified via a width probe (offsets up to 30px
        // against several worst-case long addresses) that this doesn't cost
        // the address any wrapping room -- the text column shrinks by the
        // same amount as this reservation grows, keeping a constant ~5px
        // gap between the two rather than eating into safety margin. Only
        // the 2.25x1.25 preset had this problem reported; other presets
        // keep the original 9px via qrRightOffset falling back below.
        var qrRightOffset = cfg.qrRightOffset || '9px';
        var qrRightOffsetNum = parseInt(qrRightOffset);
        // Reservation stays 1px wider than qrRightOffset so wrapped text
        // still clears the column (same relationship as before, just now
        // tracking whatever qrRightOffset actually is instead of a fixed 9).
        var rightPadding = (paddingNum + qrSizeNum + qrRightOffsetNum + 1) + 'px';
        // Word doesn't reliably honor position:absolute the way a browser
        // does -- it was rendering the QR image as if it were a floating
        // inline image at the very start of the content instead of pinned
        // to the top-right corner, which squeezed the header/name/product/
        // address into a narrow column beside it instead of under it (only
        // caught once an actual Word download was tested, since every
        // verification render up to that point used headless Chromium,
        // which handles position:absolute correctly). Word gets a totally
        // different, table-based two-column layout below instead (tables
        // are one of the few layout mechanisms Word's HTML engine renders
        // predictably) -- so it doesn't need the print path's right-padding
        // reservation trick to keep text clear of an absolutely-positioned
        // QR column; plain symmetric padding is enough since the table's
        // own column split does that job instead.
        // Print-only left inset: pushes flush-left content (header/name/
        // product/address) right by printLeftShiftPx if the preset sets
        // one, leaving that as blank space on the physical label's left
        // edge instead -- same mechanism as printRightTrim/qrRightOffset
        // above, just on the left side and additive to the normal padding
        // rather than replacing it. Word isn't affected (uses cfg.padding
        // untouched) since it wasn't reported having this problem.
        var printLeftPadding = (paddingNum + (cfg.printLeftShiftPx || 0)) + 'px';
        // Word-only left inset, same idea as printLeftPadding above but for
        // the Word download path -- first reported cut off on its left edge
        // on the 4x3 preset (see wordLeftShiftPx comment there). Word was
        // never given ANY left/right correction before now since it hadn't
        // been reported affected; presets without wordLeftShiftPx keep the
        // original plain symmetric padding.
        var wordLeftPadding = (paddingNum + (cfg.wordLeftShiftPx || 0)) + 'px';
        var labelPadding = forWord
          ? (cfg.padding + ' ' + cfg.padding + ' ' + cfg.padding + ' ' + wordLeftPadding)
          : (cfg.padding + ' ' + rightPadding + ' ' + cfg.padding + ' ' + printLeftPadding);
        var countTop = (2 + qrSizeNum + 3) + 'px';
        // Print-only: shrinks the visible box by printRightTrim (if the
        // preset sets one), leaving that sliver as blank space on the
        // physical label's right edge instead of shifting the declared
        // page/paper size itself -- see the printRightTrim comment on the
        // 2.25x1.25 preset above for why. calc() mixes labelDim's own unit
        // (mm/in) with a px trim fine; browsers convert both to a common
        // unit internally. Word keeps the untrimmed cfg.labelDim, and
        // presets with no printRightTrim also fall through unchanged.
        var labelWidthCss = (!forWord && cfg.printRightTrim)
          ? ('calc(' + cfg.labelDim + ' - ' + cfg.printRightTrim + ')')
          : cfg.labelDim;
        // Word's HTML-as-.doc converter only picks up page size/margins from
        // its own "mso" CSS dialect -- a *named* @page selector (Section1
        // here) applied to a div via the "page" property -- and silently
        // ignores the plain, unnamed "@page{size:...}" rule just below,
        // which is the one browsers use for print. That's why the printed
        // label came out the right size but the Word download kept landing
        // on default Letter paper no matter what labelDim/heightDim said:
        // the size was computed correctly, Word just never saw it. Both
        // rules are declared so print (unnamed @page) and Word (named
        // Section1 + div.Section1) each get the page size from the one
        // they actually read.
        var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>@page Section1{size:' + cfg.labelDim + ' ' + cfg.heightDim + ';mso-page-orientation:portrait;margin:0in 0in 0in 0in;}div.Section1{page:Section1;}* { margin: 0; padding: 0; }body{font-family:Arial;margin:0;padding:0}@page{size:' + cfg.labelDim + ' ' + cfg.heightDim + ';margin:0;padding:0}@media print{body{margin:0;padding:0}}html{margin:0;padding:0}.label{width:' + labelWidthCss + ' !important;height:' + cfg.heightDim + ' !important;padding:' + labelPadding + ' !important;margin:0 !important;page-break-inside:avoid;box-sizing:border-box;line-height:1;overflow:hidden;word-wrap:break-word;overflow-wrap:break-word;display:block;position:relative}.header{font-size:' + cfg.headerSize + ';font-weight:bold;display:block;text-align:center;border:1px solid #000;margin:0;padding:1px 0}.name{font-size:' + cfg.fontSize + ';font-weight:bold;display:block;margin:2px 0 0 0;padding:0;word-break:break-word}.product{font-size:' + cfg.productSize + ';font-weight:bold;display:block;margin:2px 0 0 0;padding:0;word-break:break-word}.address{font-size:' + cfg.addressSize + ';font-weight:bold;line-height:1.1;margin:2px 0 0 0;border-top:1px solid #000;border-bottom:1px solid #000;padding:2px 0;display:block;word-break:break-word}.note{font-weight:bold;margin:2px 0 0 0;border-top:1px solid #000;padding-top:2px;display:block;word-break:break-word}.item-note{font-size:' + cfg.addressSize + ';font-weight:bold;font-style:italic;margin:1px 0 0 0;display:block;word-break:break-word}.qr{width:' + cfg.qrSize + ';height:' + cfg.qrSize + ';position:absolute;top:2px;right:' + qrRightOffset + ';margin:0;padding:0}.count{font-size:' + cfg.countSize + ';font-weight:bold;position:absolute;top:' + countTop + ';right:' + qrRightOffset + ';margin:0;padding:0;white-space:nowrap}.countWord{font-size:' + cfg.countSize + ';font-weight:bold;text-align:right;margin:0 0 2px 0;padding:0;white-space:nowrap}</style></head><body><div class="Section1">';
        // Counts labels emitted so far so every label after the first opens
        // on its own fresh page. Needed because Word doesn't reliably clip
        // content to .label's fixed height/overflow:hidden the way a
        // browser does -- when one label's content (a long note especially,
        // at 1.5x the name font) runs taller than the box, Word just lets
        // it flow past the border into the space where the next label
        // starts, instead of cutting it off. page-break-inside:avoid on
        // .label only stops a label from being split internally; it does
        // nothing to force the *next* label onto a new page, so overflow
        // from one order's label was bleeding into the next order's label
        // and both were printing as if merged into one. A real forced break
        // before each label (the `<br clear=all style='...page-break-
        // before:always'>` form, since Word needs `mso-special-character:
        // line-break` on the <br> for a plain page-break-before to actually
        // take effect) guarantees a hard boundary between labels no matter
        // how much any single one overflows. This is ONLY emitted for Word
        // (forWord===true) now -- a real browser already starts a fresh
        // page for every label on its own, because .label's fixed height
        // exactly equals the @page size. Adding this SAME forced break in
        // the browser/print path on top of that double-counted the page
        // break: label 1 already filled page 1 (natural break to page 2),
        // then the forced <br> immediately forced ANOTHER break right at
        // the top of that fresh page, so a fully blank page appeared after
        // every label (confirmed by rendering 3 orders and getting 5 pages
        // instead of 3 -- page 1 = label 1, page 2 = blank, page 3 = label
        // 2, ...). That blank page is what was showing up as "the bottom of
        // one label spilling into the next" -- nothing to do with the
        // physical label/backing paper size.
        // .label also used to carry a 5px bottom margin (left over from an
        // earlier layout that packed multiple labels per sheet), which is
        // removed too -- with @page sized to exactly one label there's no
        // room for it and no need for it now that each label gets its own
        // page.
        var labelCount = 0;
        orders.forEach(function(order) {
          if (order.items) {
            // Delivery Name (who to hand it to) takes priority; falls back to
            // the customer's own name for the common case where nobody
            // filled in a separate delivery name (self-delivery).
            var deliveryNameDisplay = (order.deliveredTo && order.deliveredTo.trim()) ? order.deliveredTo.trim() : app.cleanLastName(order.lastName);
            var addressParts = app.splitAddress(order.address);
            var addressHtml = addressParts.city ? (addressParts.address + '<br>' + addressParts.city) : addressParts.address;
            order.items.forEach(function(item, idx) {
              // quantityIndividual (e.g. "3 Individual") prefixes the product
              // name when set -- carried over from the old Word-only download
              // HTML so consolidating onto this shared builder doesn't drop it,
              // and print now shows it too since it never had before.
              var productDisplay = item.quantityIndividual ? (item.quantityIndividual + ' ' + item.product) : item.product;
              if (labelCount > 0 && forWord) {
                html += "<br clear=all style='mso-special-character:line-break;page-break-before:always'>";
              }
              labelCount++;
              var textBlockHtml = '<div class="header">BASKETS BY BLIMI</div>' +
                '<div class="name">' + deliveryNameDisplay + '</div>' +
                '<div class="product">' + productDisplay + '</div>' +
                (item.specialInstructions ? '<div class="item-note">' + item.specialInstructions + '</div>' : '') +
                '<div class="address">' + addressHtml + '</div>' +
                (order.customerNote ? '<div class="note" style="font-size:' + app.pickNoteFontPx(cfg, order.customerNote) + '"><strong>Note:</strong> ' + order.customerNote + '</div>' : '');
              if (forWord) {
                // Word's HTML import kept breaking the QR image no matter
                // how it was laid out: position:absolute first squeezed all
                // the text into a narrow column beside a floating QR, and a
                // table-based two-column layout (tried next) still ended up
                // with the QR floating loose and overlapping text, with
                // cells rendering as disconnected boxes instead of one
                // label -- Word's HTML-to-.doc conversion treats embedded
                // images as floating/anchored objects fairly unpredictably
                // regardless of CSS. Given the QR's only real job is being
                // scanned off a physical printed label, and the Print path
                // (which already has a correctly working QR, verified
                // repeatedly) is what actually produces those, the Word
                // download just skips the QR entirely rather than keep
                // fighting Word's image import -- plain stacked text, which
                // Word has never had a problem with. The count ("1 of 2")
                // is kept as plain right-aligned text since that's not an
                // image and was never actually part of the problem.
                html += '<div class="label">' +
                  '<div class="countWord">' + (idx + 1) + ' of ' + order.items.length + '</div>' +
                  textBlockHtml +
                  '</div>';
              } else {
                html += '<div class="label">' +
                  '<img class="qr" src="' + app.QR_CODE_DATA_URI + '" alt="">' +
                  '<div class="count">' + (idx + 1) + ' of ' + order.items.length + '</div>' +
                  textBlockHtml +
                  '</div>';
              }
            });
          }
        });
        html += '</div></body></html>';
        return html;
      },

      // Opens a blank tab, writes the label HTML into it, and triggers
      // print. Split out so printLabels/printOrder are just "build the
      // HTML, then print it" -- one place to fix if the print mechanics
      // ever need to change again.
      openAndPrintHtml: function(html) {
        var w = window.open('', '_blank');
        w.document.write(html);
        w.document.close();
        setTimeout(function() { w.print(); }, 500);
      },

      printLabels: function() {
        var dayOrders = app.getOrdersForDate(app.selectedDate);
        app.openAndPrintHtml(app.buildLabelsHtml(dayOrders));
      },

      printOrder: function(orderIndex) {
        var dayOrders = app.getOrdersForDate(app.selectedDate);
        var order = dayOrders[orderIndex];
        if (!order) return;
        app.openAndPrintHtml(app.buildLabelsHtml([order]));
      },

      // Checkbox selection for batch printing -- e.g. check off every order
      // going out on the small label, print/download just those, then
      // switch the label size, check off the rest, and print that batch --
      // instead of "Print All" (which doesn't make sense once a single
      // day's orders are split across two different label sizes) or
      // clicking Print on every single order one at a time.
      toggleOrderSelection: function(orderIndex) {
        if (app.selectedOrderIndices[orderIndex]) {
          delete app.selectedOrderIndices[orderIndex];
        } else {
          app.selectedOrderIndices[orderIndex] = true;
        }
        app.render();
      },

      selectAllOrders: function() {
        var dayOrders = app.getOrdersForDate(app.selectedDate);
        dayOrders.forEach(function(order, idx) { app.selectedOrderIndices[idx] = true; });
        app.render();
      },

      clearOrderSelection: function() {
        app.selectedOrderIndices = {};
        app.render();
      },

      // Shared by printSelected/downloadSelected/downloadSelectedPdf --
      // pulls out just the checked orders, in their original day-order.
      getSelectedOrders: function() {
        var dayOrders = app.getOrdersForDate(app.selectedDate);
        return dayOrders.filter(function(order, idx) { return app.selectedOrderIndices[idx]; });
      },

      printSelected: function() {
        var selected = app.getSelectedOrders();
        if (selected.length === 0) { alert('No orders selected'); return; }
        app.openAndPrintHtml(app.buildLabelsHtml(selected));
      },

      downloadSelected: function() {
        var selected = app.getSelectedOrders();
        if (selected.length === 0) { alert('No orders selected'); return; }
        app.triggerFileDownload('BasketsByBlimi_' + app.selectedDate + '_Selected_Labels.doc', app.buildLabelsHtml(selected, true), 'application/msword');
      },

      downloadSelectedPdf: function() {
        var selected = app.getSelectedOrders();
        if (selected.length === 0) { alert('No orders selected'); return; }
        if (!window.jspdf) { alert('PDF library failed to load -- check your internet connection and try again.'); return; }
        app.buildLabelsPdf(selected).save('BasketsByBlimi_' + app.selectedDate + '_Selected_Labels.pdf');
      },

      render: function() {
        var appDiv = document.getElementById('app');
        
        if (app.showSetup) {
          appDiv.innerHTML = '<div class="auth-box"><h2>Setup</h2><p style="color:#6b7280;margin-bottom:15px">Paste your Google Service Account JSON key once. You won\'t need to paste it again.</p>' + (app.error ? '<div class="error">' + app.error + '</div>' : '') + '<textarea id="keyInput" placeholder="Paste your JSON key..."></textarea><button onclick="app.setupKey(document.getElementById(\'keyInput\').value)">Save Key</button></div>';
          return;
        }

        if (app.loading) {
          appDiv.innerHTML = '<div class="loading">Loading orders...</div>';
          return;
        }

        if (!app.isAuthenticated || app.orders.length === 0) {
          appDiv.innerHTML = '<div class="auth-box"><div class="error">' + (app.error || 'No orders') + '</div><button onclick="app.showSetup=true;app.render()">Setup</button></div>';
          return;
        }

        if (app.showAddOrder) {
          appDiv.innerHTML = app.renderAddOrderForm();
          app.initAddressAutocomplete();
          app.updateDeliveryFieldsState();
          return;
        }

        var dayOrders = app.getOrdersForDate(app.selectedDate);
        // A selection built against a different date, or against a
        // different number of orders on this same date (one was added or
        // deleted since you last checked boxes), is stale -- indices could
        // now point at the wrong order. Drop it rather than risk printing
        // the wrong label under a leftover checkmark.
        if (app.selectedOrdersDate !== app.selectedDate || app.selectedOrdersCount !== dayOrders.length) {
          app.selectedOrderIndices = {};
          app.selectedOrdersDate = app.selectedDate;
          app.selectedOrdersCount = dayOrders.length;
        }
        var selectedCount = Object.keys(app.selectedOrderIndices).length;
        var totals = app.getProductTotals(app.selectedDate);
        var dates = app.getAllDates();
        var currentIdx = dates.indexOf(app.selectedDate);

        var dayRevenue = app.getDayRevenue(app.selectedDate);
        var html = '<div class="date-nav"><button onclick="app.previousDate()" ' + (currentIdx === 0 ? 'disabled' : '') + '>←</button><div class="date-display"><h2>' + app.formatDateDisplay(app.selectedDate) + '</h2><p>' + dayOrders.length + ' orders</p>' + (dayRevenue > 0 ? '<p style="color:#16a34a;font-weight:bold;font-size:15px;margin-top:2px">$' + dayRevenue.toFixed(2) + ' total</p>' : '') + '</div><button onclick="app.nextDate()" ' + (currentIdx === dates.length - 1 ? 'disabled' : '') + '>→</button></div>';

        if (Object.keys(totals).length > 0) {
          html += '<div class="totals-box"><h3>Product Totals</h3><div class="totals-grid">';
          Object.entries(totals).sort(function(a, b) { return b[1] - a[1]; }).forEach(function(entry) {
            html += '<div class="total-item"><div class="total-number">' + entry[1] + '</div><div class="total-label">' + entry[0] + '</div></div>';
          });
          html += '</div></div>';
        }

        // Picks which getLabelStyleConfig preset print/download use. Only
        // the two sizes actually in use are offered; more presets already
        // exist in getLabelStyleConfig (3x2, 2x1) and can be added here
        // later without touching that function.
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:#374151"><label for="labelSizeSelect">Label size:</label><select id="labelSizeSelect" onchange="app.setLabelSize(this.value)" style="padding:6px 8px;border:1px solid #d1d5db;border-radius:6px">' +
          '<option value="4x3"' + (app.labelSize === '4x3' ? ' selected' : '') + '>4in x 3in (large)</option>' +
          '<option value="2.25x1.25"' + (app.labelSize === '2.25x1.25' ? ' selected' : '') + '>2.25in x 1.25in (small)</option>' +
          '</select></div>';

        html += '<div class="action-buttons"><button class="print-btn" onclick="app.openAddOrder()" style="background:#16a34a">+ Add Order</button></div>';

        // Batch printing by checkbox selection, replacing the old "print
        // everything for the day" buttons -- a day's orders are usually a
        // mix of both label sizes, so "print all" meant either printing the
        // wrong size for half the orders or printing them one at a time.
        // Check off just the orders going out on whichever size is picked
        // above, print/download that batch, then switch the label size,
        // check off the rest, and print the second batch -- two batches
        // total instead of N individual prints.
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">' +
          '<span style="font-size:13px;color:#374151">' + selectedCount + ' selected</span>' +
          '<button onclick="app.selectAllOrders()" ' + (dayOrders.length === 0 ? 'disabled' : '') + ' style="background:#6b7280;color:white;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px">Select All</button>' +
          '<button onclick="app.clearOrderSelection()" ' + (selectedCount === 0 ? 'disabled' : '') + ' style="background:#6b7280;color:white;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px">Clear</button>' +
          '</div>';
        html += '<div class="action-buttons"><button class="print-btn" onclick="app.printSelected()" ' + (selectedCount === 0 ? 'disabled' : '') + ' style="background:#7c3aed">🖨️ Print Selected (' + selectedCount + ')</button><button class="print-btn" onclick="app.downloadSelected()" ' + (selectedCount === 0 ? 'disabled' : '') + ' style="background:#2563eb">📥 Word Selected (' + selectedCount + ')</button><button class="print-btn" onclick="app.downloadSelectedPdf()" ' + (selectedCount === 0 ? 'disabled' : '') + ' title="Correctly label-sized PDF, for printing from your phone (e.g. FlashLabel Pro)" style="background:#0f766e">📄 PDF Selected (' + selectedCount + ')</button></div>';

        if (dayOrders.length === 0) {
          html += '<div class="empty-state">No orders for this date</div>';
        } else {
          html += '<div class="orders-box">';
          dayOrders.forEach(function(order, orderIdx) {
            var isSelected = !!app.selectedOrderIndices[orderIdx];
            html += '<div class="order-item" style="' + (isSelected ? 'outline:2px solid #7c3aed;outline-offset:-2px;' : '') + '"><div style="display:flex;justify-content:space-between;align-items:start"><div style="display:flex;gap:8px;align-items:start"><input type="checkbox" onchange="app.toggleOrderSelection(' + orderIdx + ')" ' + (isSelected ? 'checked' : '') + ' title="Select for batch print/download" style="margin-top:4px;width:18px;height:18px;flex-shrink:0"><div><div class="order-name">' + order.lastName + '</div><div style="font-size:11px;color:#059669;font-weight:bold;margin-top:3px">Order ' + (orderIdx + 1) + '</div>';
            if (order.deliveredTo) html += '<div class="order-address">Deliver to: ' + order.deliveredTo + '</div>';
            html += '<div class="order-address">' + order.address + '</div><div style="font-size:11px;color:#9ca3af;margin-top:5px;text-transform:uppercase">' + (order.pickupOrDelivery || 'delivery') + '</div>';
            if (order.total) {
              // Sheet cell may or may not already include a "$" depending on
              // how it was typed/formatted there — don't double it up.
              var totalDisplay = /^\$/.test(order.total) ? order.total : ('$' + order.total);
              html += '<div style="font-size:14px;color:#16a34a;font-weight:bold;margin-top:5px">Total: ' + totalDisplay + '</div>';
            }
            html += '</div></div><div style="display:flex;gap:5px"><button onclick="app.openEditOrder(' + orderIdx + ')" title="Edit this order" style="background:#6b7280;color:white;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap;height:fit-content">✏️ Edit</button><button onclick="app.printOrder(' + orderIdx + ')" title="Print this order\'s label(s) straight to your label printer" style="background:#7c3aed;color:white;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap;height:fit-content">🖨️ Print</button><button onclick="app.downloadOrder(' + orderIdx + ')" style="background:#2563eb;color:white;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap;height:fit-content">📥 Word</button><button onclick="app.downloadOrderPdf(' + orderIdx + ')" title="Correctly label-sized PDF, for printing from your phone" style="background:#0f766e;color:white;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap;height:fit-content">📄 PDF</button></div></div>';
            html += '<div class="order-items">';
            if (order.items) {
              order.items.forEach(function(item, idx) {
                // Special instructions wrapped into the same left-hand <span>
                // as the product name (not a third bare sibling) so the row
                // stays exactly two flex children -- product info on the
                // left, qty/count on the right -- same as before.
                html += '<div><span><strong>' + item.product + '</strong>' + (item.specialInstructions ? ' <span style="color:#dc2626;font-weight:normal;font-size:12px">(' + item.specialInstructions + ')</span>' : '') + '</span> <span>qty: ' + item.quantity + ' • <strong>' + (idx + 1) + ' of ' + order.items.length + '</strong></span></div>';
              });
            }
            html += '</div>';
            if (order.customerNote) {
              html += '<div class="order-note"><strong>Note:</strong> ' + order.customerNote + '</div>';
            }
            html += '</div>';
          });
          html += '</div>';
        }

        appDiv.innerHTML = html;
      }
    };

    app.checkSetup();

    // Fires once the Google Maps script finishes loading. If the Add Order
    // form happens to already be open at that point, attach autocomplete to
    // its address field now (initAddressAutocomplete() is a no-op until this
    // has run, so opening the form earlier doesn't error).
    function onGoogleMapsLoaded() {
      if (app.showAddOrder) app.initAddressAutocomplete();
    }

    // The Maps API key lives in a Vercel environment variable (GOOGLE_MAPS_API_KEY),
    // not in this file, so it never sits in the committed source. Fetch it
    // from the server and load the Maps script with it at runtime instead.
    fetch('/api/maps-key').then(function(r) { return r.json(); }).then(function(data) {
      if (!data.key) return; // not configured yet — app still works, just no address autocomplete
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(data.key) + '&libraries=places&loading=async&callback=onGoogleMapsLoaded';
      s.async = true;
      s.defer = true;
      document.head.appendChild(s);
    }).catch(function() { /* no autocomplete this session, form still usable */ });
  </script>
</body>
</html>
